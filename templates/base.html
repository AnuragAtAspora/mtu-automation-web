<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MoEngage Metrics{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 32px; }
        h2 { color: #34495e; margin: 30px 0 15px; font-size: 24px; }
        h3 { color: #7f8c8d; margin: 20px 0 10px; font-size: 18px; }
        
        .subtitle { color: #7f8c8d; margin-bottom: 30px; }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .alert-info { background: #e3f2fd; border-left: 4px solid #2196f3; color: #1976d2; }
        .alert-success { background: #e8f5e9; border-left: 4px solid #4caf50; color: #388e3c; }
        .alert-warning { background: #fff3e0; border-left: 4px solid #ff9800; color: #f57c00; }
        .alert-error { background: #ffebee; border-left: 4px solid #f44336; color: #c62828; }
        
        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input[type="date"],
        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        
        .btn:hover { background: #2980b9; }
        .btn-large { padding: 15px 40px; font-size: 18px; }
        .btn-secondary { background: #95a5a6; }
        .btn-secondary:hover { background: #7f8c8d; }
        
        .grid { display: grid; gap: 30px; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }
        
        .segment-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }
        
        .segment-name { font-weight: 600; margin-bottom: 8px; color: #2c3e50; }
        .segment-id { font-size: 12px; color: #7f8c8d; margin-bottom: 10px; }
        
        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        .metrics-table th,
        .metrics-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .metrics-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .metrics-table tr:hover {
            background: #f8f9fa;
        }
        
        .text-center { text-align: center; }
        .mt-4 { margin-top: 40px; }
        .mb-4 { margin-bottom: 40px; }
        
        .flash-messages {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
